name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@c4fb45df0d9c674a2c4c37c9e2cfc4e2bf9ab16d # v3.28.5
        with:
          languages: go

      - uses: github/codeql-action/analyze@c4fb45df0d9c674a2c4c37c9e2cfc4e2bf9ab16d # v3.28.5

  govulncheck:
    name: Go Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.24'
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@b625048270ac6c5a4cdc11739a3c6a78c2b633b5 # v1.0.0

  zizmor:
    name: Workflow Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@4e7bb5b31b6d6606350c6c17ecb25b468e8c5781 # v0.1.1